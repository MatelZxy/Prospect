<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prospect</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f6f8;--sf:#fff;--ink:#151821;--mut:#6b7080;--ln:#e3e5ea;--ac:#2f4bff;--lead:#e5484d;--ok:#12a150;--nv:#b7791f;--r:12px}
@media(prefers-color-scheme:dark){:root{--bg:#0e1014;--sf:#161922;--ink:#eceef3;--mut:#8c92a3;--ln:#262a36;--ac:#7d8cff;--lead:#ff6b70;--ok:#3ecf8e;--nv:#e0a84a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Manrope,system-ui,sans-serif}
main{max-width:980px;margin:auto;padding:28px 16px 90px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;margin-bottom:34px}.logo i{width:18px;height:18px;border-radius:50%;border:5px solid var(--ac)}
h1{font-size:clamp(28px,5vw,42px);line-height:1.1;letter-spacing:-.035em;font-weight:800;margin:0 0 8px;max-width:14em}
.sub{color:var(--mut);margin:0 0 24px}
.search{display:flex;flex-wrap:wrap;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:6px;gap:2px}
.search>*{border:0;background:none;color:var(--ink);font:inherit;padding:12px 14px;outline:none;min-width:0}
.search input{flex:1 1 200px}.search select{border-left:1px solid var(--ln);border-radius:0;cursor:pointer}
.search:focus-within{border-color:var(--ac)}
.go{background:var(--ac)!important;color:#fff!important;border-radius:11px!important;font-weight:700;cursor:pointer;padding:12px 24px!important}.go:disabled{opacity:.6}
#prog{height:2px;margin:10px 4px 0;background:var(--ln);overflow:hidden;visibility:hidden}#prog i{display:block;width:30%;height:100%;background:var(--ac);animation:l 1s infinite}
@keyframes l{from{margin-left:-30%}to{margin-left:100%}}
#msg{color:var(--mut);min-height:22px;margin:6px 4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 26px}.chips button{border:1px solid var(--ln);background:none;color:var(--mut);border-radius:99px;padding:3px 11px;font:inherit;font-size:12px;cursor:pointer}.chips button:hover{color:var(--ink);border-color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);margin-bottom:26px}
.stats div{flex:1 1 120px;padding:14px 16px;border-right:1px solid var(--ln)}.stats div:last-child{border:0}
.stats b{display:block;font-size:24px;letter-spacing:-.02em}.stats span{color:var(--mut);font-size:12.5px}.stats .hot b{color:var(--lead)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tabs{display:flex;gap:4px;background:var(--ln);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer}.tabs button.on{background:var(--sf);color:var(--ink)}.tabs i{font-style:normal;opacity:.6;margin-left:4px}
.tools input[type=text],.tools select,.tools>button{background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:7px 11px;font:inherit;cursor:pointer}
.tools input[type=text]{flex:1;min-width:150px;cursor:text}.tools label{color:var(--mut);display:flex;gap:5px;align-items:center;cursor:pointer}
.sp{flex:1}
.list{border:1px solid var(--ln);border-radius:var(--r);background:var(--sf);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:14px 16px;border-bottom:1px solid var(--ln);border-left:3px solid transparent;align-items:center}
.row:last-child{border-bottom:0}.row.SEM_SITE{border-left-color:var(--lead)}.row.done{opacity:.55}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top h3{margin:0;font-size:15px;font-weight:600}
.pill{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px}
.SEM_SITE .pill{background:color-mix(in srgb,var(--lead) 14%,transparent);color:var(--lead)}.COM_SITE .pill{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.NAO_VERIFICADO .pill{background:color-mix(in srgb,var(--nv) 16%,transparent);color:var(--nv)}
.meta{color:var(--mut);font-size:12.5px;display:flex;gap:4px 14px;flex-wrap:wrap}
.act{display:flex;gap:4px;justify-content:flex-end}.act a,.act button{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--ln);border-radius:9px;background:none;color:var(--mut);cursor:pointer}
.act a:hover,.act button:hover{color:var(--ink);border-color:var(--ink)}.act .on{background:var(--ac);border-color:var(--ac);color:#fff}
.act svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.notes{grid-column:1/-1}textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--ln);border-radius:8px;padding:8px;font:inherit;resize:vertical}
.empty{padding:48px 20px;text-align:center;color:var(--mut)}.sk{height:62px;border-bottom:1px solid var(--ln);background:linear-gradient(90deg,transparent,var(--bg),transparent) 0/200% 100%;animation:s 1.2s infinite}@keyframes s{to{background-position:-200% 0}}
.more{display:block;margin:16px auto;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:10px;padding:8px 20px;font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media(max-width:640px){.row{grid-template-columns:1fr}.act{justify-content:flex-start}.search select{border-left:0;border-top:1px solid var(--ln);flex:1}.go{flex:1 1 100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main>
<div class="logo"><i></i>Prospect</div>
<h1>Encontre quem ainda não tem site.</h1><p class="sub">Pesquise uma cidade e veja quais negócios podem virar cliente.</p>
<div class="search"><input type="text" id="city" placeholder="Cidade, ex.: Birigui" aria-label="Cidade"><select id="uf" aria-label="Estado"></select><select id="cat" aria-label="Categoria"></select><button class="go" id="go">Pesquisar</button></div>
<div id="prog"><i></i></div><div id="msg"></div><div class="chips" id="hist"></div>
<div class="stats" id="stats"></div>
<div class="tools"><div class="tabs" id="tabs"></div><input type="text" id="q" placeholder="Buscar pelo nome" aria-label="Buscar pelo nome"><input type="hidden" id="fs" value="">
<select id="fr" aria-label="Nota mínima"><option value="0">Qualquer nota</option><option value="4">4+ estrelas</option><option value="4.5">4,5+ estrelas</option></select>
<label><input type="checkbox" id="fp"> Telefone</label><label><input type="checkbox" id="fi"> Instagram</label><button id="ffav">Favoritas</button><span class="sp"></span><button id="csv">CSV</button><button id="xls">Excel</button></div>
<div class="list" id="res"></div><button class="more" id="more">Mostrar mais</button>
</main><script>
const $=s=>document.querySelector(s),CATS={restaurantes:'Restaurantes e lanchonetes',roupas:'Lojas de roupas e calçados',mercados:'Mercados e supermercados',beleza:'Barbearias e salões',oficinas:'Oficinas mecânicas',clinicas:'Clínicas e consultórios',academias:'Academias',padarias:'Padarias e confeitarias',hoteis:'Hotéis e pousadas',servicos:'Prestadores de serviços',outros:'Outros comércios'};
const ST={SEM_SITE:'Sem site',COM_SITE:'Com site',NAO_VERIFICADO:'Não verificado'};
const P={chat:'<path d="M21 12a8 8 0 0 1-11.7 7L4 20l1.1-4.9A8 8 0 1 1 21 12z"/>',ig:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/>',fb:'<path d="M14 8h3V4h-3a4 4 0 0 0-4 4v3H7v4h3v6h4v-6h3l1-4h-4V8z"/>',web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',pin:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',star:'<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',ok:'<path d="m5 12 5 5 9-10"/>',note:'<path d="M5 4h14v12l-4 4H5z"/><path d="M9 9h6M9 13h3"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${P[n]}</svg>`;
const db=JSON.parse(localStorage.getItem('ps')||'{"hist":[],"biz":{},"fav":{},"done":{},"notes":{}}');
const save=()=>localStorage.setItem('ps',JSON.stringify(db));
let cur=[],shown=25,onlyFav=false,open=new Set();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#uf').innerHTML='AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ').map(u=>`<option ${u=='SP'?'selected':''}>${u}</option>`).join('');
$('#cat').innerHTML=Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');

function stats(){const all=Object.values(db.biz),n=s=>all.filter(b=>b.status==s).length;
 $('#stats').innerHTML=[['Empresas encontradas',all.length],['Sem site',n('SEM_SITE'),'hot'],['Com site',n('COM_SITE')],['Não verificadas',n('NAO_VERIFICADO')],['Favoritas',Object.keys(db.fav).length]].map(([l,v,c])=>`<div class="${c||''}"><b>${v}</b><span>${l}</span></div>`).join('');
 $('#hist').innerHTML=db.hist.map((h,i)=>`<button data-i="${i}">${esc(h.city)}-${h.uf}, ${CATS[h.cat].toLowerCase()}</button>`).join('')}
function tabs(){const c=cur.map(i=>db.biz[i]).filter(Boolean),n=s=>c.filter(b=>b.status==s).length;
 $('#tabs').innerHTML=[['SEM_SITE',n('SEM_SITE')],['COM_SITE',n('COM_SITE')],['NAO_VERIFICADO',n('NAO_VERIFICADO')],['',c.length]].map(([s,k])=>`<button data-s="${s}" class="${$('#fs').value==s?'on':''}">${s?ST[s]:'Todas'}<i>${k}</i></button>`).join('')}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#fs').value=b.dataset.s;shown=25;render()};

$('#go').onclick=async()=>{const city=$('#city').value.trim(),uf=$('#uf').value,cat=$('#cat').value;
 if(!city)return $('#msg').textContent='Digite o nome da cidade para pesquisar.';
 const t0=Date.now(),tm=setInterval(()=>$('#msg').textContent=`Buscando… ${Math.round((Date.now()-t0)/1000)}s (pode levar até 30s)`,1000);
 $('#msg').textContent='Buscando…';$('#prog').style.visibility='visible';$('#go').disabled=true;$('#res').innerHTML='<div class="sk"></div>'.repeat(5);
 try{const r=await fetch(`/api/search?${new URLSearchParams({city,uf,cat})}`),j=await r.json();if(!r.ok)throw new Error(j.error);
  j.results.forEach(b=>db.biz[b.id]=b);cur=j.results.map(b=>b.id);onlyFav=false;
  db.hist=[{city,uf,cat,ids:cur,src:j.source},...db.hist.filter(h=>!(h.city==city&&h.uf==uf&&h.cat==cat))].slice(0,15);save();
  const sem=j.results.filter(b=>b.status=='SEM_SITE').length;$('#fs').value=sem?'SEM_SITE':'';
  $('#msg').textContent=cur.length?`${cur.length} empresas encontradas via ${j.source}, ${sem} sem site.`:'Nenhuma empresa encontrada. Tente outra categoria ou confira o nome da cidade.';
 }catch(e){cur=[];$('#msg').textContent=e.message||'Não foi possível falar com o servidor. Verifique se ele está rodando.'}
 clearInterval(tm);$('#prog').style.visibility='hidden';$('#go').disabled=false;shown=25;stats();render()};
$('#city').onkeydown=e=>{if(e.key=='Enter')$('#go').click()};
$('#hist').onclick=e=>{const i=e.target.dataset.i;if(i==null)return;const h=db.hist[i];cur=h.ids;$('#city').value=h.city;$('#uf').value=h.uf;$('#cat').value=h.cat;$('#fs').value='SEM_SITE';shown=25;$('#msg').textContent='';render()};
$('#ffav').onclick=()=>{onlyFav=!onlyFav;if(onlyFav){cur=Object.keys(db.fav);$('#fs').value=''}shown=25;render()};

const list=()=>{const q=$('#q').value.toLowerCase(),s=$('#fs').value,r=+$('#fr').value;
 return cur.map(id=>db.biz[id]).filter(b=>b&&(!q||b.name.toLowerCase().includes(q))&&(!s||b.status==s)&&(!r||b.rating>=r)&&(!$('#fp').checked||b.phone)&&(!$('#fi').checked||b.instagram))};
function render(){tabs();const l=list();$('#more').style.display=l.length>shown?'':'none';
 $('#res').innerHTML=l.slice(0,shown).map(b=>{const d=(b.phone||'').replace(/\D/g,''),w=d?`https://wa.me/${d.length<=11?'55'+d:d}`:'',lk=(h,i,t)=>`<a href="${esc(h)}" target="_blank" rel="noopener" title="${t}" aria-label="${t}">${ic(i)}</a>`,bt=(a,i,t,on)=>`<button data-a="${a}" data-id="${b.id}" class="${on?'on':''}" title="${t}" aria-label="${t}">${ic(i)}</button>`;
 return `<article class="row ${b.status} ${db.done[b.id]?'done':''}"><div><div class="top"><span class="pill">${ST[b.status]}</span><h3>${esc(b.name)}</h3></div>
 <div class="meta"><span>${CATS[b.category]}</span><span>${esc(b.address)||'Endereço não informado'}</span><span>${esc(b.phone)||'Sem telefone'}</span>${b.rating?`<span>${b.rating} estrelas, ${b.reviews} avaliações</span>`:''}</div></div>
 <div class="act">${w?lk(w,'chat','Abrir WhatsApp'):''}${b.instagram?lk(b.instagram,'ig','Abrir Instagram'):''}${b.facebook?lk(b.facebook,'fb','Abrir Facebook'):''}${b.website?lk(b.website,'web','Visitar site'):''}${b.lat?lk(`https://www.google.com/maps/search/?api=1&query=${b.lat},${b.lon}`,'pin','Ver no mapa'):''}
 ${bt('note','note','Anotações',open.has(b.id))}${bt('fav','star','Favoritar',db.fav[b.id])}${bt('done','ok','Marcar como contatada',db.done[b.id])}</div>
 ${open.has(b.id)||db.notes[b.id]?`<div class="notes"><textarea rows="2" placeholder="Anotações sobre esta empresa" data-id="${b.id}">${esc(db.notes[b.id])}</textarea></div>`:''}</article>`}).join('')
 ||`<div class="empty">${cur.length?'Nenhuma empresa com esses filtros. Troque a aba ou limpe os filtros.':'Nenhuma pesquisa por aqui ainda. Digite uma cidade e escolha uma categoria.'}</div>`}
$('#res').onclick=e=>{const x=e.target.closest('button');if(!x)return;const a=x.dataset.a,id=x.dataset.id;
 if(a=='note'){open.has(id)?open.delete(id):open.add(id)}else{const o=db[a];o[id]?delete o[id]:o[id]=1;save();stats()}render()};
$('#res').oninput=e=>{db.notes[e.target.dataset.id]=e.target.value;save()};
$('#more').onclick=()=>{shown+=25;render()};
['q','fr','fp','fi'].forEach(i=>$('#'+i).oninput=()=>{shown=25;render()});

const rows=()=>list().map(b=>({Nome:b.name,Categoria:CATS[b.category],Endereço:b.address,Telefone:b.phone,Instagram:b.instagram,Facebook:b.facebook,Site:b.website,Nota:b.rating,Avaliações:b.reviews,Situação:ST[b.status],Contatado:db.done[b.id]?'Sim':'',Favorita:db.fav[b.id]?'Sim':'',Notas:db.notes[b.id]||''}));
const ws=()=>XLSX.utils.json_to_sheet(rows());
$('#csv').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+XLSX.utils.sheet_to_csv(ws())],{type:'text/csv'}));a.download='empresas.csv';a.click()};
$('#xls').onclick=()=>{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws(),'Empresas');XLSX.writeFile(wb,'empresas.xlsx')};
stats();render();
</script></body></html>
